name: Solicitar compatibilidad
description: Reportá un build nuevo de Farever o del minimapa.
title: "[Compatibilidad]: "
labels: ["compatibility"]
body:
  - type: markdown
    attributes:
      value: |
        Los hashes desconocidos se bloquean hasta completar pruebas. No subas archivos del juego ni del minimapa.
  - type: input
    id: game-version
    attributes:
      label: Versión visible de Farever
    validations:
      required: true
  - type: input
    id: game-hash
    attributes:
      label: SHA-256 de hlboot.dat
    validations:
      required: true
  - type: input
    id: minimap-version
    attributes:
      label: Versión del minimapa
      placeholder: v1.2.4
    validations:
      required: true
  - type: input
    id: minimap-hash
    attributes:
      label: SHA-256 de dinput8.dll
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Mensaje mostrado por Farever Translate
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacidad
      options:
        - label: Confirmo que no incluí API keys, conversaciones ni archivos ajenos.
          required: true
